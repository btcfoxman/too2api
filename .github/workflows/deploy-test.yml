name: Pre-production Docker

on:
  push:
    branches: [pre]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: too2api-pre-production
  cancel-in-progress: false

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: btcfoxman
  IMAGE_NAME: too2api
  DEPLOY_PATH: /home/btcfoxman/docker/too2api
  DEPLOY_SERVICE: too2api
  TOO2API_HOSTNAME: too2api.aiid.edu.kg
  TOO2API_ORIGIN: http://127.0.0.1:8812
  CLOUDFLARED_CONFIG: /etc/cloudflared/config.yml

jobs:
  build:
    runs-on: [self-hosted, linux, x64, too2api-pre]
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build from cached base and publish
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/btcfoxman/too2api:${GITHUB_SHA}"
          docker build --pull=false -t "$image" -t ghcr.io/btcfoxman/too2api:latest .
          docker push "$image"
          docker push ghcr.io/btcfoxman/too2api:latest

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, too2api-pre]
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull reviewed image and deploy only while idle
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker pull "$image"
          python3 scripts/deploy_pre.py --image "$image" --revision "$IMAGE_TAG" --deploy-path "$DEPLOY_PATH"
      - name: Verify public endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "https://${TOO2API_HOSTNAME}/health" >/dev/null; then exit 0; fi
            sleep 5
          done
          exit 1
